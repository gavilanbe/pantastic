<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantastic!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥖</text></svg>">
<link rel="stylesheet" href="src/ui.css">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="rain"></div>
<div id="ui">
  <div id="world"></div>
  <div id="hud" class="hide">
    <div id="cal">
      <div class="leaf" id="leaf"><div class="top" id="dc-wd">lunes</div><small>día</small><b id="dc-day">1</b></div>
      <div class="clock">
        <div class="sunarc"><svg viewBox="0 0 140 40" preserveAspectRatio="none"><path d="M6 38 Q70 -30 134 38" fill="none" stroke="#dcc59a" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/></svg><div id="sun"></div></div>
        <div class="row2"><span id="dc-time">7:00</span><span id="dc-wx"></span></div>
      </div>
      <div id="dc-antojo"></div>
    </div>
    <div id="topright">
      <div id="money"><span class="coin"></span><b id="money-n">0</b></div>
      <div id="rep"><div class="rosette"><b id="rep-lv">1</b></div><div><div id="rep-name"></div><div class="loafbar"><i id="rep-bar"></i></div></div></div>
      <div id="shelf"></div>
    </div>
    <div id="goal"><img id="goal-ic" alt=""><span id="goal-t"></span></div>
    <div id="keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> moverse</span><span><kbd>E</kbd> acción</span><span><kbd>M</kbd> sonido</span></div>
    <button id="btn-lib" title="Libreta (L)"></button>
  </div>
  <div id="prompt" class="hide"></div>
  <div id="knead" class="hide"><div class="k-title">¡Amasa cuando el aro toque la masa!</div><div class="k-stage"><div class="k-ring"></div><div class="k-target"></div><div class="k-core"><kbd>E</kbd></div></div><div class="k-dots"></div><div class="k-word"></div></div>
  <div id="fade"></div>
  <div id="toasts"></div>
  <div id="dialog" class="hide"><div id="dlg-face"><img alt=""></div><div id="dlg-name"></div><div id="dlg-text"></div><div id="dlg-next">▼</div></div>
  <div id="modal" class="hide"></div>
  <div id="title" class="hide"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
